name: Artifacts (Package)

on: [push, pull_request, workflow_dispatch]

jobs:
  artifacts-mingw-w64:
    runs-on: ubuntu-latest
    container: archlinux/archlinux:base-devel

    steps:
    - name: Install dependencies
      run: pacman -Syu --needed --noconfirm git meson mingw-w64-gcc glslang

    - name: Checkout code
      id: checkout-code
      uses: actions/checkout@v6
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Setup problem matcher
      uses: Joshua-Ashton/gcc-problem-matcher@master

    - name: Get version
      id: get-version
      shell: bash
      run: |
        echo "VERSION_NAME=${GITHUB_REF_NAME//\//-}-${GITHUB_SHA::8}" >> $GITHUB_ENV
        echo "VERSION=$(cat RELEASE)" >> $GITHUB_ENV

    - name: Build dist tree
      id: build-dist
      run: |
        make
        make dist

    - name: Upload artifacts
      id: upload-artifacts
      uses: actions/upload-artifact@v7
      with:
        name: dxvk-sarek-${{ env.VERSION_NAME }}
        path: build/dist/dxvk-sarek-${{ env.VERSION }}
        if-no-files-found: error
