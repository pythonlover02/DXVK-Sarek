        meson setup --cross-file .github/crossfiles/steamrt-i386.txt
        --buildtype "release"
        --prefix "$( realpath build/dxvk-sarek-${{ env.VERSION_NAME }} )"
        --strip
        --bindir "i386-windows"
        --libdir "i386-windows"
        -Db_ndebug=if-release
        -Dbuild_id=false
        "build/build.i386"

    - name: Build i386
      id: build-artifacts-i386
      shell: bash
      run: ninja -C build/build.i386 install

    - name: Configure x86_64
      id: configure-artifacts-x86_64
      shell: bash
      run: >-
        meson setup --cross-file .github/crossfiles/steamrt-x86_64.txt
