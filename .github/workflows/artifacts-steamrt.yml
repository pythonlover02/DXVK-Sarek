        "build/build.x86_64"

    - name: Build x86_64
      id: build-artifacts-x86_64
      shell: bash
      run: ninja -C build/build.x86_64 install

    - name: Upload artifacts
      id: upload-artifacts
      uses: actions/upload-artifact@v7
